# The MCP server (D-13, ADR 0013): rmcp pinned exactly, server + stdio only, no HTTP features.
[package]
name = "civkit-mcp"
description = "CivKit MCP server over stdio"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
civkit-core = { path = "../../crates/civkit-core" }
civkit-drawing = { path = "../../crates/civkit-drawing" }   # the drawing tool (D-28)
rmcp = { version = "=3.12.0", default-features = false, features = ["server", "transport-io"] }
serde_json.workspace = true
civkit-units.workspace = true
# rmcp brings tokio with "rt"; the server runs on one current-thread runtime.
tokio = { version = "1", default-features = false, features = ["rt"] }

[lints]
workspace = true
